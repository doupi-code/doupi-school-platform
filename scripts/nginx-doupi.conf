# 豆皮校园管理综合服务平台 Nginx 生产与测试环境配置
upstream doupi_server_cluster {
    server 127.0.0.1:8088 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ========================================================
# 1. HTTP (端口 80)
# - 域名请求自动 301 重定向至 HTTPS
# - IP/Localhost 请求直接服务，便于直接访问与内部调试
# ========================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 101.43.58.160 doupi.cloud www.doupi.cloud;

    charset utf-8;
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    # 针对域名请求强制跳转 HTTPS (若域名备案未完成，开启 301 会导致 443 SNI 被拦截，暂时允许 80 直接访问)
    # if ($host ~* ^(doupi\.cloud|www\.doupi\.cloud)$) {
    #     return 301 https://$host$request_uri;
    # }

    # Gzip 压缩加速
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1.1 Web 用户门户 (根路径)
    location / {
        root /var/www/doupi-web-client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/doupi-web-client/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 1.2 React 后台管理端 (/admin)
    location /admin {
        alias /var/www/doupi-web-admin/dist;
        index index.html index.htm;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /admin/assets/ {
        alias /var/www/doupi-web-admin/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 1.3 后端业务 API 反向代理 (/prod-api/)
    location /prod-api/ {
        proxy_pass http://doupi_server_cluster/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 1.4 Druid & Swagger 反向代理
    location /druid/ {
        proxy_pass http://doupi_server_cluster/druid/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://doupi_server_cluster/swagger-ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs/ {
        proxy_pass http://doupi_server_cluster/v3/api-docs/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1.5 微信小程序网关与官网接口
    location /api/wx/ {
        proxy_pass http://doupi_server_cluster/api/wx/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://doupi_server_cluster/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # 1.6 上传附件与静态媒体文件
    location /profile/ {
        alias /data/doupi/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 1.7 兼容服务
    location /notes/ {
        proxy_pass http://127.0.0.1:8745/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /public-assets/ {
        alias /var/www/public-assets/;
        expires 7d;
        access_log off;
    }
}

# ========================================================
# 2. HTTPS (端口 443)
# - 豆皮校园管理综合服务平台生产 HTTPS 核心入口
# ========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doupi.cloud www.doupi.cloud;

    charset utf-8;
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/doupi.cloud/doupi.cloud_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/doupi.cloud/doupi.cloud.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip 压缩加速
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 2.1 Web 用户门户 (根路径)
    location / {
        root /var/www/doupi-web-client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/doupi-web-client/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 2.2 React 后台管理端 (/admin)
    location /admin {
        alias /var/www/doupi-web-admin/dist;
        index index.html index.htm;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /admin/assets/ {
        alias /var/www/doupi-web-admin/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 2.3 后端业务 API 反向代理 (/prod-api/)
    location /prod-api/ {
        proxy_pass http://doupi_server_cluster/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2.4 Druid & Swagger 反向代理
    location /druid/ {
        proxy_pass http://doupi_server_cluster/druid/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /swagger-ui/ {
        proxy_pass http://doupi_server_cluster/swagger-ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /v3/api-docs/ {
        proxy_pass http://doupi_server_cluster/v3/api-docs/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2.5 微信小程序统一分发入口 (/api/wx/)
    location /api/wx/ {
        proxy_pass http://doupi_server_cluster/api/wx/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # 2.6 官网门户公开数据与通用接口 (/api/)
    location /api/ {
        proxy_pass http://doupi_server_cluster/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # 2.7 上传附件与静态媒体文件 (/profile/)
    location /profile/ {
        alias /data/doupi/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 2.8 兼容服务
    location /notes/ {
        proxy_pass http://127.0.0.1:8745/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /public-assets/ {
        alias /var/www/public-assets/;
        expires 7d;
        access_log off;
    }
}

# ========================================================
# 3. 测试环境 (Test Environment - 端口 8081)
# ========================================================
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    charset utf-8;
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        root /var/www/doupi-web-admin-test/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /admin {
        alias /var/www/doupi-web-admin-test/dist;
        index index.html index.htm;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/(admin/)?assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/doupi-web-admin-test/dist;
        expires 7d;
        access_log off;
    }

    location /prod-api/ {
        proxy_pass http://127.0.0.1:8089/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /profile/ {
        alias /data/doupi-test/uploadPath/;
        expires 7d;
        access_log off;
    }
}
