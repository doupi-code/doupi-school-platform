# 豆皮校园管理综合服务平台 Nginx 生产环境配置
upstream doupi_server_cluster {
    server 127.0.0.1:8088 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 101.43.58.160 doupi.cloud;

    charset utf-8;
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    # Gzip 压缩加速
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ==========================================
    # 1. Web 用户门户 (根路径)
    # ==========================================
    location / {
        root /var/www/doupi-web-client/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 用户端静态资源长期强缓存
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/doupi-web-client/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ==========================================
    # 2. React 后台管理端 (/admin)
    # ==========================================
    location /admin {
        alias /var/www/doupi-web-admin/dist;
        index index.html index.htm;
        try_files $uri $uri/ /admin/index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理端静态资源长期强缓存
    location ^~ /admin/assets/ {
        alias /var/www/doupi-web-admin/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ==========================================
    # 3. 后端业务 API 反向代理 (/prod-api/)
    # ==========================================
    location /prod-api/ {
        proxy_pass http://doupi_server_cluster/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_buffering off;
        proxy_cache off;
    }

    # ==========================================
    # 3.1 Druid 数据库连接池监控反向代理 (/druid/)
    # ==========================================
    location /druid/ {
        proxy_pass http://doupi_server_cluster/druid/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 3.2 Swagger 与 OpenAPI 反向代理 (/swagger-ui/, /v3/api-docs/)
    # ==========================================
    location /swagger-ui/ {
        proxy_pass http://doupi_server_cluster/swagger-ui/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs/ {
        proxy_pass http://doupi_server_cluster/v3/api-docs/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # 4. 微信小程序与统一网关分发入口 (/api/wx/)
    # ==========================================
    location /api/wx/ {
        proxy_pass http://doupi_server_cluster/api/wx/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # 4.1 官网门户公开数据与通用接口 (/api/)
    # ==========================================
    location /api/ {
        proxy_pass http://doupi_server_cluster/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # 5. 上传附件与静态媒体文件 (/profile/)
    # ==========================================
    location /profile/ {
        alias /data/doupi/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ==========================================
    # 6. 原服务器兼容服务：Hermes Note Viewer
    # ==========================================
    location /notes/ {
        proxy_pass http://127.0.0.1:8745/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # 7. 原服务器公共资产目录兼容
    # ==========================================
    location /public-assets/ {
        alias /var/www/public-assets/;
        expires 7d;
        access_log off;
    }
}

# ========================================================
# 4. 测试环境 (Test Environment - 端口 8081)
# ========================================================
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    charset utf-8;
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 测试管理端后台根访问
    location / {
        root /var/www/doupi-web-admin-test/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 测试管理端 /admin 别名兼容
    location /admin {
        alias /var/www/doupi-web-admin-test/dist;
        index index.html index.htm;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 测试静态资源
    location ~* ^/(admin/)?assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/doupi-web-admin-test/dist;
        expires 7d;
        access_log off;
    }

    # 测试后端 API 反向代理 (/prod-api/ -> 127.0.0.1:8089)
    location /prod-api/ {
        proxy_pass http://127.0.0.1:8089/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 测试公共 API (/api/ -> 127.0.0.1:8089/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:8089/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 测试环境文件上传与附件 (/profile/)
    location /profile/ {
        alias /data/doupi-test/uploadPath/;
        expires 7d;
        access_log off;
    }
}

