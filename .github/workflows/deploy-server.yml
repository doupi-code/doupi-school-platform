name: Deploy Backend Server (Native Systemd)

on:
  push:
    branches: [ main ]
    paths:
      - 'doupi-server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Deployment Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "::error::未检测到 GitHub Secrets (SERVER_HOST / SERVER_SSH_KEY)！"
            echo "::error::请先在仓库 Settings -> Secrets and variables -> Actions 中添加部署密钥。"
            exit 1
          fi

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config << 'EOF'
          Host deploy-host
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER || 'cicd' }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config
          # 验证 SSH 联通性 (快速失败机制)
          ssh -o ConnectTimeout=10 deploy-host "whoami"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven Build
        run: |
          cd doupi-server
          mvn clean package -DskipTests

      - name: Transfer JAR Package
        run: |
          scp -o ConnectTimeout=30 doupi-server/doupi-admin/target/doupi-admin.jar deploy-host:/data/doupi/doupi-admin.jar.new

      - name: Restart Service & Health Check
        run: |
          ssh deploy-host << 'EOF'
            set -e
            TARGET_DIR="/data/doupi"
            SERVICE_NAME="doupi-server"
            HEALTH_PORT=8088

            mkdir -p $TARGET_DIR/backups
            if [ -f "$TARGET_DIR/doupi-admin.jar" ]; then
              cp "$TARGET_DIR/doupi-admin.jar" "$TARGET_DIR/backups/doupi-admin-$(date +%Y%m%d%H%M%S).jar"
            fi
            # 保留最近 5 份备份，自动清理陈旧备份
            cd $TARGET_DIR/backups && ls -t | sed -e '1,5d' | xargs -d '\n' rm -f 2>/dev/null || true

            # 原地原子替换
            mv $TARGET_DIR/doupi-admin.jar.new $TARGET_DIR/doupi-admin.jar
            sudo systemctl restart $SERVICE_NAME

            # 自动化健康探活 (最多 25 秒)
            sleep 8
            HEALTHY=0
            for i in {1..10}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${HEALTH_PORT}/login" || true)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "404" ]; then
                echo "Health Check Passed! Service $SERVICE_NAME is running healthy (HTTP $HTTP_CODE)."
                HEALTHY=1
                break
              fi
              echo "Waiting for service to become ready... ($i/10)"
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed! Rolling back to latest backup..."
              LATEST_BAK=$(ls -t $TARGET_DIR/backups/doupi-admin-*.jar 2>/dev/null | head -n 1)
              if [ -n "$LATEST_BAK" ] && [ -f "$LATEST_BAK" ]; then
                cp "$LATEST_BAK" $TARGET_DIR/doupi-admin.jar
                sudo systemctl restart $SERVICE_NAME
                echo "Rolled back to $LATEST_BAK"
              fi
              exit 1
            fi
            echo "Backend Server Deployed and Verified Successfully!"
          EOF
