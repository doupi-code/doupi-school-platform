name: Deploy Backend Server (Native Systemd)

on:
  push:
    branches: [ main ]
    paths:
      - 'doupi-server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Deployment Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "::error::未检测到 GitHub Secrets (SERVER_HOST / SERVER_SSH_KEY)！"
            echo "::error::请先在仓库 Settings -> Secrets and variables -> Actions 中添加部署密钥。"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Maven Build
        run: |
          cd doupi-server
          mvn clean package -DskipTests

      - name: Prepare Backup & Clean Remote Temp
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'cicd' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 60s
          script: |
            TARGET_DIR="/data/doupi"
            mkdir -p $TARGET_DIR/backups
            if [ -f "$TARGET_DIR/doupi-admin.jar" ]; then
              cp "$TARGET_DIR/doupi-admin.jar" "$TARGET_DIR/backups/doupi-admin-$(date +%Y%m%d%H%M%S).jar"
            fi
            cd $TARGET_DIR/backups && ls -t | sed -e '1,3d' | xargs -d '\n' rm -f 2>/dev/null || true
            rm -f /tmp/doupi-admin.jar

      - name: Upload New JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'cicd' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          source: "doupi-server/doupi-admin/target/doupi-admin.jar"
          target: "/tmp/"
          strip_components: 3

      - name: Restart Service & Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'cicd' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 60s
          script: |
            TARGET_DIR="/data/doupi"
            SERVICE_NAME="doupi-server"
            HEALTH_PORT=8088

            mv /tmp/doupi-admin.jar $TARGET_DIR/doupi-admin.jar
            sudo systemctl restart $SERVICE_NAME

            # 自动化健康探活 (15秒)
            sleep 8
            HEALTHY=0
            for i in {1..8}; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${HEALTH_PORT}/login" || true)
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "404" ]; then
                echo "Health Check Passed! Service $SERVICE_NAME is running healthy (HTTP $HTTP_CODE)."
                HEALTHY=1
                break
              fi
              echo "Waiting for service to become ready... ($i/8)"
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed! Rolling back to latest backup..."
              LATEST_BAK=$(ls -t $TARGET_DIR/backups/doupi-admin-*.jar 2>/dev/null | head -n 1)
              if [ -n "$LATEST_BAK" ] && [ -f "$LATEST_BAK" ]; then
                cp "$LATEST_BAK" $TARGET_DIR/doupi-admin.jar
                sudo systemctl restart $SERVICE_NAME
                echo "Rolled back to $LATEST_BAK"
              fi
              exit 1
            fi
