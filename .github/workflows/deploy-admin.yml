name: Deploy Admin Web (Native Nginx)

on:
  push:
    branches: [ main ]
    paths:
      - 'doupi-web-admin-react/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Deployment Secrets
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "::error::未检测到 GitHub Secrets (SERVER_HOST / SERVER_SSH_KEY)！"
            echo "::error::请先在仓库 Settings -> Secrets and variables -> Actions 中添加部署密钥。"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd doupi-web-admin-react
          npm install --legacy-peer-deps
          npm run build
          tar -czf dist-admin.tar.gz dist

      - name: Upload Dist Archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'cicd' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          source: "doupi-web-admin-react/dist-admin.tar.gz"
          target: "/tmp/"
          strip_components: 1

      - name: Atomic Deploy & Nginx Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'cicd' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 60s
          script: |
            TARGET_DIR="/var/www/doupi-web-admin"
            mkdir -p $TARGET_DIR
            mkdir -p /tmp/unpack_admin
            tar -xzf /tmp/dist-admin.tar.gz -C /tmp/unpack_admin
            rm -rf $TARGET_DIR/dist
            mv /tmp/unpack_admin/dist $TARGET_DIR/dist
            rm -rf /tmp/unpack_admin /tmp/dist-admin.tar.gz
            sudo systemctl reload nginx
            echo "Admin Web Deployed to $TARGET_DIR successfully!"
