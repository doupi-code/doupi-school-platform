# 豆皮教育全端统一网关与静态托管 Nginx 配置
# 针对 4核 4G 生产云服务器优化

# Upstream 后端集群
upstream doupi_server_cluster {
    server doupi-server:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost doupi.example.com;

    # 生产环境中如果配置了 SSL 证书，可取消下方跳转注释
    # return 301 https://$host$request_uri;

    # 全局字符集与日志
    charset utf-8;
    access_log /var/log/nginx/doupi_access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/doupi_error.log warn;

    # 客户端上传文件大小限制 (支持大附件与高精度扫描件)
    client_max_body_size 50M;
    client_body_buffer_size 512k;

    # ==========================================
    # Gzip 全站压缩加速
    # ==========================================
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # ==========================================
    # 安全响应头加固
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ==========================================
    # 1. Web 用户端 (官网/访校预约) -> 根路径
    # ==========================================
    location / {
        root /usr/share/nginx/html/client;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # HTML 页面禁用缓存，保证版本即时更新
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 用户端静态资源长期强缓存
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html/client;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ==========================================
    # 2. React 管理端 (系统管理/教务/库存/大屏) -> /admin
    # ==========================================
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html index.htm;
        try_files $uri $uri/ /admin/index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 管理端静态资源强缓存
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ==========================================
    # 3. 后端业务 API 反向代理 -> /prod-api/
    # ==========================================
    location /prod-api/ {
        proxy_pass http://doupi_server_cluster/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时时间调整
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 禁用 proxy buffering 以支持大屏 SSE 流式传输
        proxy_buffering off;
        proxy_cache off;
    }

    # ==========================================
    # 4. 微信小程序与统一网关分发入口 -> /api/wx/
    # ==========================================
    location /api/wx/ {
        proxy_pass http://doupi_server_cluster/api/wx/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 20s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # 5. 上传附件与静态媒体文件 -> /profile/
    # ==========================================
    location /profile/ {
        alias /home/doupi/uploadPath/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
